<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melódico Design</title>
    <meta name="description" content="Melódico Design: calcomanías, calcas y vinil de corte. Entra al catálogo y compra en línea.">
    <meta name="theme-color" content="#0b0f1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #0b0f1a;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* Ambient light */
        .glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 22%, rgba(16, 185, 129, .14), transparent 42%),
                radial-gradient(circle at 82% 76%, rgba(59, 130, 246, .16), transparent 46%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, .08), transparent 60%);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .035;
            z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .stage {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(28px, 6vh, 52px);
            padding: 28px;
        }

        /* ---------- Store link ---------- */
        .store {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: clamp(18px, 4vw, 24px) clamp(26px, 7vw, 46px) clamp(16px, 3vw, 20px);
            border-radius: 24px;
            border: 2px solid #111;
            background: linear-gradient(180deg, #ffffff 0%, #e9ecf2 100%);
            box-shadow:
                0 26px 54px -22px rgba(0, 0, 0, .85),
                inset 0 1px 0 #fff;
            text-decoration: none;
            color: #111;
            overflow: hidden;
            isolation: isolate;
            transition: transform .3s ease, box-shadow .3s ease;
            animation: rise .8s .15s cubic-bezier(.22, .61, .36, 1) both;
        }

        .store::after {
            content: "";
            position: absolute;
            top: -30%;
            left: 0;
            width: 45%;
            height: 160%;
            z-index: 2;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent);
            transform: translateX(-180%) skewX(-18deg);
            pointer-events: none;
            animation: sheen 6s ease-in-out infinite;
        }

        .store:hover,
        .store:focus-visible {
            transform: translateY(-5px);
            box-shadow:
                0 34px 64px -20px rgba(0, 0, 0, .9),
                inset 0 1px 0 #fff;
            outline: none;
        }

        .store:focus-visible {
            outline: 3px solid #60a5fa;
            outline-offset: 4px;
        }

        .store-logo {
            width: clamp(196px, 52vw, 300px);
            height: auto;
            display: block;
        }

        .store-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(10px, 2.4vw, 12px);
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #1d4ed8;
        }

        .store-cta svg {
            width: 15px;
            height: 15px;
            transition: transform .3s ease;
        }

        .store:hover .store-cta svg,
        .store:focus-visible .store-cta svg {
            transform: translateX(5px);
        }

        /* ---------- Motion ---------- */
        @keyframes sheen {

            0%,
            52% {
                transform: translateX(-180%) skewX(-18deg);
            }

            78%,
            100% {
                transform: translateX(320%) skewX(-18deg);
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(22px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .store,
            .store::after {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="glow"></div>
    <div class="grain"></div>

    <main class="stage">
        <a class="store" href="https://design.melodico.net">
            <img class="store-logo" src="assets/images/melodigodesign_logo.png" alt="Melódico Design" width="1008"
                height="376">
            <span class="store-cta">
                design.melodico.net
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </span>
        </a>
    </main>
</body>

</html>
